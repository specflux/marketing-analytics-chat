name: Beta

# Rolling beta: every push to the `beta` branch re-runs the PHP gate, builds
# the zip the same way release.yml does, and replaces the assets on one
# GitHub prerelease tagged `beta-build` (not `beta`, so the tag never shadows
# the branch). A cron job on the beta server polls the .sha256 and fetches
# the zip.
# Not a release: release.yml and deploy-wporg.yml stay tag/release-triggered.
#
# Asset names are a contract with the server script — do not rename them:
#   specflux-marketing-analytics-chat-beta.zip,
#   specflux-marketing-analytics-chat-beta.zip.sha256, beta-info.json

on:
  push:
    branches: [beta]
  workflow_dispatch:

# Queue, don't cancel: a run cancelled mid-upload would leave a new zip
# next to the old checksum.
concurrency:
  group: beta-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  SLUG: specflux-marketing-analytics-chat

jobs:
  # The blocking steps of tests.yml: the Unit, Security and WordPress.org
  # suites, plus PHPCS.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Test suites
        run: |
          vendor/bin/phpunit --no-coverage --testsuite=Unit
          vendor/bin/phpunit --no-coverage --testsuite=Security
          vendor/bin/phpunit --no-coverage --testsuite=WordPress.org

      - name: PHPCS
        if: matrix.php == '8.1'
        run: vendor/bin/phpcs

  publish:
    needs: check
    runs-on: ubuntu-latest
    name: Build and publish the beta zip
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: sodium, mbstring, json, curl

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Same file selection as release.yml's "Build release ZIP"; the
      # top-level folder inside the zip is the slug.
      - name: Build the zip
        run: |
          BUILD_DIR="$(mktemp -d)"
          mkdir -p "$BUILD_DIR/$SLUG"
          rsync -a --exclude-from=.distignore ./ "$BUILD_DIR/$SLUG/"
          (cd "$BUILD_DIR/$SLUG" && rm -rf vendor/phpunit vendor/phpstan vendor/squizlabs vendor/sebastian \
            vendor/phpcsstandards vendor/wp-coding-standards vendor/dealerdirect \
            vendor/phar-io vendor/myclabs vendor/nikic vendor/theseer vendor/yoast)
          mkdir -p beta-out
          (cd "$BUILD_DIR" && zip -qr "$GITHUB_WORKSPACE/beta-out/${SLUG}-beta.zip" "$SLUG")
          unzip -l "beta-out/${SLUG}-beta.zip" | tail -1

      # The checksum is computed from inside the output dir so the file lists
      # the bare name, as sha256sum prints.
      - name: Write checksum + info
        run: |
          VERSION=$(awk '/^[[:space:]]*\*[[:space:]]*Version:/ {print $NF; exit}' "${SLUG}.php")
          [ -n "$VERSION" ] || { echo "::error::could not read Version from plugin header"; exit 1; }
          (cd beta-out && sha256sum "${SLUG}-beta.zip" > "${SLUG}-beta.zip.sha256")
          jq -n --arg commit "$GITHUB_SHA" --arg version "$VERSION" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, version: $version, built_at: $built_at}' > beta-out/beta-info.json
          cat beta-out/beta-info.json beta-out/"${SLUG}-beta.zip.sha256"

      - name: Create the rolling prerelease if missing, keep it a prerelease
        run: |
          if gh release view beta-build >/dev/null 2>&1; then
            # Move the tag to this commit so the release page matches the
            # assets, and undo any manual promotion to draft/latest.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/beta-build" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit beta-build --prerelease --draft=false --latest=false
          else
            gh release create beta-build --prerelease --latest=false \
              --title "Beta (rolling)" \
              --notes "Rolling build of the \`beta\` branch, replaced on every push. For the beta server only — not for production." \
              --target "$GITHUB_SHA"
          fi

      # Zip first, checksum last: the server polls the .sha256 and then
      # fetches the zip, so it never sees a new checksum before its zip.
      - name: Upload assets (zip, then checksum, then info)
        run: |
          gh release upload beta-build "beta-out/${SLUG}-beta.zip" --clobber
          gh release upload beta-build "beta-out/${SLUG}-beta.zip.sha256" --clobber
          gh release upload beta-build beta-out/beta-info.json --clobber
